[project]
name = "highlights-feeder"
version = "0.1.0"
description = "Sync book highlights from Notion and email a daily digest."
readme = "README.md"
authors = [
    { name = "Christos Lathourakis", email = "53656840+xristosl0610@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.1",
    "typer>=0.27.3",
    "tzdata>=2026.5",
]

[project.scripts]
feeder = "highlights_feeder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.2"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
